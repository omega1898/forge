# Continuous integration: run the test suite on every push and pull request.
# Windows, macOS and Linux are all first-class targets, and each needs its own
# evidence (for example, the project lock uses different OS calls on Windows).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check committed JSON schemas match the models
        run: python -m forge.contracts.schemas
      - name: Test
        run: python -m pytest -q
      - name: Language toolchains for the Ada, Fortran, COBOL, OCaml, emulator, shell and RE packs (Linux)
        # Package names differ between Ubuntu releases; try each alternative and report
        # anything missing. Tests that need a missing tool skip with that reason.
        # GCC 14 is needed for MC/DC (-fcondition-coverage) and its matching gcov-14.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          for group in "gcc-14" "g++-14" "gnat-14" "gfortran-14" "clang-tidy" "cppcheck" \
                       "gnucobol3 gnucobol4 gnucobol" "ocaml-nox ocaml" "ocaml-findlib" \
                       "qemu-user-static qemu-user" "gcc-arm-linux-gnueabihf" "libc6-dev-armhf-cross" \
                       "shellcheck" "radare2" "default-jdk-headless"; do
            done_group=no
            for package in $group; do
              if sudo apt-get install -y -q --no-install-recommends "$package"; then done_group=yes; break; fi
            done
            [ "$done_group" = yes ] || echo "::warning::not installed: $group"
          done
      - name: TypeScript compiler for the editor extension tests (Linux)
        if: runner.os == 'Linux'
        run: npm install -g typescript@6.0.2
      - name: Full suite with the isolation backend (Linux, as root)
        # The isolation backend needs root; without this step every sandboxed
        # test skips on CI and would prove nothing.
        if: runner.os == 'Linux'
        # PATH is passed through so tools installed with the Python environment (ruff) are found as root.
        run: sudo env "PATH=$PATH" "$(command -v python)" -m pytest -q
